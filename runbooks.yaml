- id: mtu
  title: บางเว็บ/บางแอปใช้ไม่ได้ (MTU / fragmentation / MSS)
  title_en: Some sites/apps fail (MTU / fragmentation / MSS)
  summary: ping แบบห้ามแตก packet ด้วยขนาดต่างๆ และดู MTU / MSS ของ interface ที่สงสัย (โดยเฉพาะ tunnel, PPPoE)
  summary_en: Ping with don't-fragment at several sizes and check MTU / MSS on the suspect interface (especially tunnels, PPPoE)
  params:
  - key: dst
    label: IP ปลายทางที่ใช้งานไม่ได้
    kind: ip
    required: true
    hint: เช่น 10.20.30.40
  - *id002
  question: บางเว็บ/บางแอปใช้ไม่ได้ (เปิดหน้าแรกได้แต่โหลดไม่ครบ, SSL ค้าง) ดูผล ping ห้ามแตก packet ที่ขนาดต่างๆ, MTU ของ interface/tunnel และ MSS clamping แล้วบอก MTU ที่ใช้ได้จริงและค่าที่ควรตั้ง
  question_en: Some sites/apps fail (first page loads but not fully, SSL hangs). Look at don't-fragment ping results at different sizes, interface/tunnel MTU and MSS clamping, then state the working path MTU and the values to set.
  causes:
  - th: ผ่าน tunnel (GRE/IPsec/PPPoE/VXLAN) ที่กิน overhead แต่ไม่ได้ลด MTU หรือ clamp TCP MSS
    en: Traffic crosses a tunnel (GRE/IPsec/PPPoE/VXLAN) with overhead but MTU isn't lowered and TCP MSS isn't clamped
  - th: ICMP 'fragmentation needed' ถูก firewall บล็อก ทำให้ Path MTU Discovery ไม่ทำงาน (black hole)
    en: ICMP 'fragmentation needed' blocked by a firewall, so Path MTU Discovery breaks (black hole)
  - th: MTU สองฝั่งของลิงก์ไม่เท่ากัน (jumbo ฝั่งเดียว)
    en: MTU differs between the two ends of a link (jumbo on one side only)
  - th: 'อาการคลาสสิก: ping ได้, เปิดเว็บหน้าแรกได้, แต่ไฟล์ใหญ่/SSL/SMB ค้าง'
    en: 'Classic symptom: ping works and the first page opens, but large files/SSL/SMB hang'
  refs:
  - title: 'Cisco: Resolve IP fragmentation, MTU, MSS and PMTUD issues with GRE and IPsec (PDF)'
    url: https://bxin.cisco.com/c/en/us/support/docs/ip/generic-routing-encapsulation-gre/25885-pmtud-ipfrag.pdf
  - title: 'Cisco Community: MTU issue over GRE/IPsec tunnel'
    url: https://community.cisco.com/t5/switching/need-help-with-mtu-issue-gre-ipsec-vpn-tunnel/m-p/1456173/highlight/true
  search: MTU MSS fragmentation PMTUD black hole tunnel
