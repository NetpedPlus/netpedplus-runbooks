- id: poe
  title: อุปกรณ์ PoE (AP / กล้อง / โทรศัพท์) ไม่ติดหรือดับเป็นช่วง
  title_en: PoE device (AP / camera / phone) not powering or dropping
  summary: ดูกำลังไฟที่จ่าย, งบไฟรวมของ switch, class ของอุปกรณ์ และ log ของพอร์ต PoE
  summary_en: Power delivered, the switch's total power budget, device class and PoE port logs
  params:
  - *id002
  question: อุปกรณ์ PoE ไม่ติดหรือดับเป็นช่วง ดูสถานะพอร์ต (on/off/faulty/denied), กำลังที่ใช้เทียบ class, งบไฟรวมของ switch และ log แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: A PoE device won't power up or drops. Look at port state (on/off/faulty/denied), power drawn vs class, the switch power budget and logs, then give the most likely cause.
  causes:
  - th: งบไฟรวมของ switch ไม่พอ (power denied) เมื่อเสียบอุปกรณ์เพิ่ม หรือ power supply ตัวหนึ่งเสีย
    en: The switch power budget is exhausted (power denied) after adding devices, or one power supply failed
  - th: อุปกรณ์ต้องการ 802.3at/bt (PoE+/UPOE เช่น AP Wi-Fi 6/7) แต่พอร์ตจ่ายได้แค่ 802.3af
    en: The device needs 802.3at/bt (PoE+/UPOE, e.g. Wi-Fi 6/7 APs) but the port only supplies 802.3af
  - th: 'พอร์ต faulty / ILPOWER error: สายยาวหรือคุณภาพต่ำ, หัวต่อเสีย, หรือมี injector ซ้อน'
    en: 'Port faulty / ILPOWER errors: long or poor-quality cable, bad connector, or a stacked injector'
  - th: 'ดับเป็นช่วงพร้อมกันหลายตัว: switch รีบูตหรือ power supply/UPS มีปัญหา ดู uptime และ log'
    en: 'Several drop at once: the switch rebooted or the PSU/UPS had issues; check uptime and logs'
  refs:
  - title: 'Cisco: Troubleshooting Power over Ethernet (Catalyst 3750, PDF)'
    url: https://www3-realm.cisco.com/en/US/docs/switches/lan/catalyst3750/software/troubleshooting/g_power_over_ethernet.pdf
