- id: remote-access-vpn
  title: VPN ผู้ใช้ (SSL VPN / GlobalProtect / AnyConnect) เชื่อมต่อไม่ได้
  title_en: Remote-access VPN (SSL VPN / GlobalProtect / AnyConnect) not connecting
  summary: ดูผู้ใช้ที่เชื่อมต่ออยู่, สถิติ, การตั้งค่าพอร์ต/ใบรับรอง และ license ของ remote access
  summary_en: Connected users, statistics, port/certificate settings and remote-access licensing
  params: []
  question: ผู้ใช้ VPN (remote access) เชื่อมต่อไม่ได้ ดูผู้ใช้ที่ต่ออยู่, จำนวนเทียบ license, ใบรับรอง, พอร์ตที่ใช้, pool IP และการยืนยันตัวตน แล้วบอกว่าล้มที่ขั้นไหน (เข้าถึงพอร์ต, ใบรับรอง, login, ได้ IP, ใช้งาน) พร้อมสาเหตุที่น่าจะเป็นที่สุด
  question_en: Remote-access VPN users can't connect. Look at connected users, count vs license, certificate, listening port, IP pool and authentication, then say which stage fails (reaching the port, certificate, login, IP assignment, usage) and the most likely cause.
  causes:
  - th: 'FortiOS 7.6.3 ขึ้นไป: SSL VPN tunnel mode ถูกเอาออก (บางรุ่นไม่มี SSL VPN แล้ว) ต้องย้ายไป IPsec dial-up / FortiClient IPsec'
    en: 'FortiOS 7.6.3+: SSL VPN tunnel mode was removed (some models no longer have SSL VPN); migrate to IPsec dial-up / FortiClient IPsec'
  - th: 'FortiClient ค้างที่ 10% / 40% / 80%: แต่ละช่วงคือคนละขั้น (เชื่อมต่อ, ยืนยันตัวตน, รับค่า tunnel) บทความ Fortinet อธิบายแยกช่วง'
    en: 'FortiClient stuck at 10% / 40% / 80%: each percentage is a different stage (connect, authenticate, tunnel setup); Fortinet documents each'
  - th: ใบรับรองหมดอายุหรือ client ไม่ trust / เวลาเครื่องเพี้ยน
    en: Expired or untrusted certificate / wrong device clock
  - th: IP pool หมด หรือจำนวนผู้ใช้เกิน license (AnyConnect/GlobalProtect)
    en: IP pool exhausted or users exceed the license (AnyConnect/GlobalProtect)
  - th: 'ต่อได้แต่ใช้งานไม่ได้: split tunnel ไม่ครอบ subnet, ไม่มี policy จาก VPN zone, หรือ route กลับไปหา pool ไม่มี'
    en: 'Connected but nothing works: split tunnel doesn''t cover the subnet, no policy from the VPN zone, or no return route to the pool'
  - th: 'ถูก brute-force / IP ถูก ban: ตรวจ log การ login ล้มเหลวจำนวนมาก'
    en: 'Brute-force attempts / banned IPs: check for many failed logins in the logs'
  notes:
