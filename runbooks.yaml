- id: optics
  title: ค่าแสง / SFP / transceiver ผิดปกติ
  title_en: Optics / SFP / transceiver issues
  summary: ดูค่า Tx/Rx power, อุณหภูมิ, แรงดัน (DOM) เทียบ threshold และตัวนับ error ของพอร์ต
  summary_en: Tx/Rx power, temperature and voltage (DOM) against thresholds, plus the port's error counters
  params:
  - *id002
  question: ลิงก์ fiber มีปัญหา ดูค่า Tx/Rx power เทียบ threshold ของทั้งสองฝั่ง, อุณหภูมิ, ชนิด SFP และ error counter แล้วบอกว่าปัญหาน่าจะอยู่ที่ฝั่งไหน (Tx ของฝั่งหนึ่ง, สาย, Rx อีกฝั่ง) และควรทำอะไร
  question_en: A fiber link has problems. Compare Tx/Rx power against thresholds on both ends, temperature, SFP type and error counters, then say where the problem most likely is (one side's Tx, the cable, the other side's Rx) and what to do.
  causes:
  - th: 'Rx ต่ำกว่า low-alarm: หัว connector สกปรก (ทำความสะอาดก่อน), สายงอ/หัก หรือระยะเกินที่ SFP รองรับ'
    en: 'Rx below the low alarm: dirty connectors (clean first), bent/broken fiber, or distance beyond the SFP rating'
  - th: 'Tx ของอีกฝั่งต่ำ: SFP ฝั่งนั้นเสื่อม (เทียบ Tx ฝั่งตรงข้ามกับ Rx ฝั่งนี้)'
    en: 'The far end''s Tx is low: that SFP is degrading (compare far-end Tx with local Rx)'
  - th: 'ชนิดไม่ตรงกัน: SR กับ LR, single-mode กับ multimode หรือ wavelength ต่างกัน'
    en: 'Type mismatch: SR vs LR, single-mode vs multimode, or different wavelengths'
  - th: 'Rx สูงเกิน high-alarm: ใช้ LR/ER ระยะสั้นโดยไม่มี attenuator'
    en: 'Rx above the high alarm: LR/ER optics on a short run without an attenuator'
  - th: SFP third-party ไม่รองรับ DOM หรือถูกปฏิเสธ (unsupported transceiver)
    en: Third-party SFP without DOM or rejected as unsupported
  refs:
