- id: dhcp
  title: เครื่องลูกข่ายไม่ได้ IP (DHCP / relay)
  title_en: Clients not getting an IP (DHCP / relay)
  summary: ดู ip helper / relay, DHCP snooping, pool และ binding บนเครื่องที่เป็น gateway หรือ DHCP server
  summary_en: ip helper / relay, DHCP snooping, pools and bindings on the gateway or DHCP server
  params:
  - *id001
  - *id002
  question: เครื่องลูกข่ายไม่ได้ IP จาก DHCP เทียบผลทุกเครื่อง ดู helper/relay ที่ชี้ server, DHCP snooping (trusted port, rate-limit, option 82), pool ที่เต็มหรือ conflict และ route กลับไปหา relay แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: 'Clients aren''t getting an IP from DHCP. Compare all devices: helper/relay pointing to the server, DHCP snooping (trusted ports, rate limit, option 82), exhausted pools or conflicts, and the server''s route back to the relay, then give the most likely cause.'
  causes:
  - th: ไม่มี ip helper-address / dhcp relay บน SVI ของ VLAN นั้น หรือชี้ IP server ผิด
    en: No ip helper-address / DHCP relay on that VLAN's SVI, or it points to the wrong server
  - th: 'DHCP snooping เปิดแต่ uplink ไม่ได้เป็น trusted หรือมี option 82 ที่ server ปฏิเสธ: OFFER ถูกทิ้ง'
    en: 'DHCP snooping enabled but the uplink isn''t trusted, or option 82 is rejected by the server: OFFERs are dropped'
  - th: server ไม่มี route กลับไปหา IP ของ relay (giaddr) หรือ firewall บล็อก UDP 67/68
    en: The server has no route back to the relay IP (giaddr), or a firewall blocks UDP 67/68
  - th: pool เต็ม / scope ไม่ตรงกับ subnet ของ giaddr / มี IP conflict
    en: Pool exhausted / scope doesn't match the giaddr subnet / IP conflicts
  - th: พอร์ต access ขึ้นช้า (ไม่มี portfast) ทำให้ client หมดเวลารอก่อน
    en: Access port comes up slowly (no portfast) so the client times out first
  refs:
  - title: 'Cisco: Troubleshoot DHCP on Catalyst 9000 switches'
    url: https://www.cisco.com/c/de_de/support/docs/switches/catalyst-9300-switch/221717-troubleshoot-dhcp-on-catalyst-9000-switc.html
