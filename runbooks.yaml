- id: fhrp
  title: 'HSRP / VRRP: gateway สลับไปมา หรือ active ทั้งคู่'
  title_en: HSRP / VRRP gateway flapping or both active
  summary: ดูสถานะ HSRP/VRRP ของทั้งคู่, priority/preempt, track และลิงก์ระหว่างกันที่ hello ต้องวิ่งผ่าน
  summary_en: HSRP/VRRP state on both peers, priority/preempt, tracking, and the link the hellos must cross
  params:
  - *id001
  question: gateway สำรอง (HSRP/VRRP) ไม่ปกติ เทียบสองเครื่อง ดู state (active/standby/master), priority, preempt, track, group/VIP และว่า hello วิ่งถึงกันไหม แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: 'The redundant gateway (HSRP/VRRP) is unhealthy. Compare both devices: state (active/standby/master), priority, preempt, tracking, group/VIP and whether hellos reach each other, then give the most likely cause.'
  causes:
  - th: 'active ทั้งคู่: hello ไปไม่ถึงกัน (VLAN ไม่อยู่บน trunk ระหว่างคู่, STP block, ACL/CoPP บล็อก 224.0.0.2/.102/.18)'
    en: 'Both active: hellos don''t reach each other (VLAN not on the inter-switch trunk, STP blocking, ACL/CoPP dropping 224.0.0.2/.102/.18)'
  - th: 'group number / version / authentication ไม่ตรงกัน: ต่างคนต่าง active'
    en: 'Group number, version or authentication mismatch: each side stays active'
  - th: 'สลับไปมา: track ไปผูกกับ interface/route ที่ขึ้นลง ร่วมกับ preempt'
    en: 'Flapping: tracking an interface/route that flaps, combined with preempt'
  - th: CPU สูงจน hello ส่งไม่ทัน (timer สั้นมาก)
    en: High CPU delays hellos (very short timers)
  - th: 'active ไม่ตรงกับ STP root: traffic อ้อมผ่าน switch อีกตัว ไม่ใช่ความเสีย แต่ทำให้ช้า'
    en: 'Active gateway not aligned with the STP root: traffic hairpins through the other switch (not broken, but slower)'
  refs:
  - title: 'Cisco: Understand and troubleshoot HSRP problems in Catalyst switch networks'
    url: https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13782-8.html
