- id: mac-flap
  title: MAC flapping / IP ซ้ำ / loop
  title_en: MAC flapping / duplicate IP / loop
  summary: ดู log MAC move, ตาราง MAC/ARP และพอร์ตที่ MAC เดียวกันโผล่ (สัญญาณของ loop หรือ IP ซ้ำ)
  summary_en: MAC-move logs, MAC/ARP tables and ports where the same MAC appears (signs of a loop or duplicate IP)
  params:
  - *id001
  question: มี MAC flapping / IP ซ้ำ ดู log MAC move ว่า MAC ไหนย้ายระหว่างพอร์ตไหน, ตาราง ARP ที่ MAC ของ IP เปลี่ยน, และ STP แล้วบอกว่าเป็น loop, IP ซ้ำ หรือการทำงานปกติของ NIC teaming/VM และจุดที่ต้องไปดู
  question_en: MAC flapping / duplicate IP. Look at MAC-move logs (which MAC moves between which ports), ARP entries whose MAC changes, and STP, then say whether it's a loop, a duplicate IP or normal NIC teaming/VM behavior, and where to look.
  causes:
  - th: 'loop ชั้น L2: MAC เดียวกันสลับไปมาระหว่าง uplink สองเส้นตลอด พร้อม topology change ถี่'
    en: 'A layer 2 loop: the same MAC bounces between two uplinks constantly with frequent topology changes'
  - th: server ใช้ NIC teaming / bond แบบ active-active ที่ไม่ได้ทำ LACP หรือ VM ย้ายโฮสต์
    en: Servers using active-active NIC teaming/bonding without LACP, or VMs migrating between hosts
  - th: 'IP ซ้ำ: ARP ของ IP เดียวกันสลับไปมาระหว่างสอง MAC (ดูยี่ห้อจาก OUI ของ MAC)'
    en: 'Duplicate IP: the ARP entry for one IP alternates between two MACs (identify vendors from the MAC OUI)'
  - th: 'HSRP/VRRP virtual MAC โผล่สองที่: gateway active ทั้งคู่ (ดูอาการ HSRP/VRRP)'
    en: 'An HSRP/VRRP virtual MAC appears in two places: both gateways active (see the HSRP/VRRP runbook)'
  refs:
