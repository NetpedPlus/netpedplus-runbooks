- id: dot1x
  title: 802.1X / MAB ยืนยันตัวตนไม่ผ่าน
  title_en: 802.1X / MAB authentication failing
  summary: ดู session การยืนยันตัวตนต่อพอร์ต, สถานะ RADIUS server, VLAN/ACL ที่ได้รับ และ log
  summary_en: Per-port authentication sessions, RADIUS server state, assigned VLAN/ACL and logs
  params:
  - *id002
  question: 802.1X/MAB ไม่ผ่าน ดู session ของพอร์ต (method dot1x/mab, สถานะ, VLAN/ACL ที่ได้), RADIUS server ว่า alive ไหมและ timeout, และ log แล้วบอกว่าล้มที่ client, switch หรือ RADIUS พร้อมสาเหตุที่น่าจะเป็นที่สุด
  question_en: 802.1X/MAB is failing. Look at the port's session (dot1x/mab method, state, assigned VLAN/ACL), whether the RADIUS server is alive and timing out, and the logs, then say whether it fails at the client, switch or RADIUS, with the most likely cause.
  causes:
  - th: 'RADIUS server ตอบไม่ทัน / dead: shared secret ไม่ตรง, server ไม่รู้จัก NAS IP (source interface ผิด) หรือ firewall บล็อก UDP 1812/1813'
    en: 'RADIUS server not answering / dead: shared secret mismatch, server doesn''t know the NAS IP (wrong source interface), or a firewall blocks UDP 1812/1813'
  - th: 'client ไม่ส่ง EAPOL (ไม่ได้เปิด 802.1X supplicant): ต้องพึ่ง MAB และลำดับ/priority ของ method'
    en: 'The client sends no EAPOL (no 802.1X supplicant): relies on MAB and the method order/priority'
  - th: certificate ฝั่ง client/server หมดอายุหรือไม่ trust (EAP-TLS/PEAP) หรือ เวลาเครื่องเพี้ยน (ดูอาการ NTP)
    en: Client/server certificate expired or untrusted (EAP-TLS/PEAP), or clocks are off (see the NTP runbook)
  - th: 'ผ่านแล้วแต่ใช้งานไม่ได้: VLAN ที่ RADIUS ส่งมาไม่มีบน switch หรือ dACL บล็อก'
    en: 'Authenticated but no access: the VLAN returned by RADIUS doesn''t exist on the switch, or a dACL blocks traffic'
  - th: 'โทรศัพท์ IP + PC พอร์ตเดียว: host-mode (multi-auth/multi-domain) ไม่ตรงกับการใช้งาน'
    en: 'IP phone + PC on one port: host-mode (multi-auth/multi-domain) doesn''t fit the setup'
  notes:
  - th: Cisco IOS 15 ใช้ 'show authentication sessions' ส่วน IOS-XE 16+ ใช้ 'show access-session' ใส่ไว้ทั้งสองแบบ
    en: Cisco IOS 15 uses 'show authentication sessions'; IOS-XE 16+ uses 'show access-session'. Both are included
  refs:
  - title: 'Cisco: Troubleshoot 802.1X on Catalyst 9000 (PDF)'
    url: https://bxin.cisco.com/c/zh_cn/support/docs/lan-switching/8021x/220919-troubleshoot-dot1x-on-catalyst-9000-seri.pdf
  - title: 'Cisco Community: How to troubleshoot ISE failed authentications'
