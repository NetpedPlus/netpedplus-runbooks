    - get vpn ipsec tunnel summary
    - get vpn ike gateway
    - get router info routing-table details {peer}
    - diagnose vpn ike gateway list
    - diagnose vpn tunnel list
    panos:
    - show vpn ike-sa
    - show vpn ipsec-sa
    - show vpn flow
    - show vpn tunnel
    junos:
    - show security ike security-associations
    - show security ipsec security-associations
    - show route {peer}
    - show security ipsec statistics
    sonicos:
    - show vpn policies
    huawei:
    - display ike sa
    - display ipsec sa
- id: stp-topology-change
  title: STP topology change ถี่ / เน็ตช้าเป็นช่วงๆ
  title_en: Frequent STP topology changes / intermittent slowness
  summary: หาว่า topology change มาจากพอร์ตไหน (ไล่ตาม 'from' ไปทีละ switch) และพอร์ต access ที่ไม่ได้ตั้ง portfast/edge
  summary_en: Find which port the topology changes come from (follow 'from' switch by switch) and access ports without portfast/edge
  params:
  - &id001
    key: vlan
    label: VLAN ID (ไม่บังคับ)
    kind: vlan
    hint: เช่น 10
  question: topology change (TCN) เกิดบ่อย เทียบผลทุกเครื่อง หาพอร์ตต้นทางของ topology change ล่าสุด (last change from), จำนวนครั้ง, root bridge, พอร์ตที่ขึ้นลง และพอร์ต access ที่ไม่ได้เป็น portfast/edge แล้วบอกจุดต้นเหตุที่น่าจะเป็นที่สุด
  question_en: Topology changes (TCN) happen often. Compare all devices, find the port where the latest topology change came from, the count, the root bridge, flapping ports and access ports not set as portfast/edge, then name the most likely source.
  causes:
  - th: 'พอร์ตที่ต่อ PC/AP/กล้อง/โทรศัพท์ ไม่ได้ตั้ง portfast / edge port: ทุกครั้งที่เครื่องปลายทางเปิดปิดจะเกิด TCN และ flush MAC ทั้ง VLAN'
    en: 'Ports facing PCs/APs/cameras/phones are not portfast / edge: every power cycle sends a TCN and flushes MACs across the VLAN'
  - th: 'ลิงก์ uplink หรือพอร์ตใดพอร์ตหนึ่งขึ้นลงจริง (สาย, SFP, ปลายทางรีบูต): ไล่จาก ''occurred/from'' ทีละ switch จนเจอพอร์ตต้นทาง'
    en: 'An uplink or some port actually flaps (cable, SFP, far end rebooting): follow ''occurred/from'' switch by switch to the originating port'
  - th: 'root bridge ไม่นิ่ง / ไม่ได้กำหนด priority: switch ใหม่หรือ switch ราคาถูกแย่ง root'
    en: 'Unstable root / no priority set: a new or cheap switch takes over as root'
  - th: ผสม STP ต่างโหมดหรือต่างยี่ห้อ (PVST+/RSTP/MSTP) ทำให้ boundary port เปลี่ยนสถานะบ่อย
    en: Mixed STP modes or vendors (PVST+/RSTP/MSTP) make boundary ports change state often
  - th: 'unmanaged switch / wireless bridge ที่ส่ง BPDU กลับมา: ตั้ง BPDU guard ที่พอร์ต access'
    en: 'Unmanaged switches / wireless bridges reflecting BPDUs: enable BPDU guard on access ports'
  refs:
  - title: 'Cisco Community: Tracking spanning-tree TCN origin'
    url: https://community.cisco.com/t5/switching/tracking-spanning-tree-tcn-origin/m-p/1164882/highlight/true
  - title: 'Cisco Community: show spanning-tree vlan detail for troubleshooting'
    url: https://community.cisco.com/t5/switching/troubleshooting-spanning-tree-show-spanning-tree-vlan-detail/m-p/4162743/highlight/true
  - title: 'Cisco: Troubleshoot STP issues on Catalyst switches'
    url: https://www3-realm.cisco.com/en/US/tech/tk389/tk621/technologies_tech_note09186a0080094797.shtml
