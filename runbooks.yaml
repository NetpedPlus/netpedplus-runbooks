    url: https://supportforums.cisco.com/document/75181/digital-optical-monitoring-dom
  - title: 'Cisco Community: Rx power low alarm on 3850'
    url: https://community.cisco.com/t5/optics-and-optical-networking/cisco-3850-gi2-0-4-rx-power-low-alarm/m-p/4555588/highlight/true
