- id: ha-cluster
  title: HA / cluster ไม่ปกติ (failover, sync)
  title_en: HA / cluster unhealthy (failover, sync)
  summary: ดูสถานะ HA ว่าเครื่องไหน active/standby, sync ครบไหม และเหตุที่ failover
  summary_en: Which unit is active/standby, whether config/session sync is complete, and why it failed over
  params: []
  question: HA / cluster ไม่ปกติ เทียบผลของทั้งสองเครื่อง ดูบทบาท (active/standby/primary/secondary), สถานะ sync ของ config และ session, เหตุผลที่ failover ล่าสุด และความต่างของเวอร์ชันหรือ config ระหว่างคู่ แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: HA / cluster is not healthy. Compare the results of both units and look at the roles (active/standby/primary/secondary), config and session sync state, the reason for the latest failover, and version or config differences between the pair, then give the most likely cause.
  causes:
  - th: 'config ไม่ sync (checksum ไม่ตรง): แก้ config บนเครื่อง standby โดยตรง, profile ต่างกัน (IPS/AV) หรือ speed auto บนพอร์ต HA'
    en: 'Config out of sync (checksum mismatch): config changed directly on the standby, differing profiles (IPS/AV), or speed auto on HA ports'
  - th: เวอร์ชัน firmware / license / รุ่นของสองเครื่องไม่ตรงกัน
    en: Firmware version, license or model differs between the two units
  - th: 'heartbeat/HA link หลุดหรือ latency สูง: split-brain (active ทั้งคู่)'
    en: 'Heartbeat/HA link down or high latency: split-brain (both active)'
  - th: failover ซ้ำเพราะ monitored interface / path monitoring ขึ้นลง
    en: Repeated failover because a monitored interface / path monitor flaps
  - th: หลังอัปเกรด เครื่องรอง checksum ว่างหรือหน้า HA โหลดไม่ขึ้น (FortiGate VM บางเวอร์ชัน)
    en: After an upgrade the secondary shows an empty checksum or the HA page fails (some FortiGate VM builds)
  refs:
  - title: 'Fortinet: HA out of synchronization'
    url: https://community.fortinet.com/t5/FortiGate/Troubleshooting-Tip-HA-out-of-synchronization/ta-p/273502
  - title: 'Fortinet: Troubleshooting a checksum mismatch in a FortiGate HA cluster'
    url: https://community.fortinet.com/fortigate-3/technical-tip-troubleshooting-a-checksum-mismatch-in-a-fortigate-ha-cluster-99096
  - title: 'Fortinet: HA out of sync due to speed auto'
    url: https://community.fortinet.com/t5/FortiGate/HA-Out-of-Sync-due-to-speed-auto-in-default-setting/ta-p/312227
  - title: 'Palo Alto: High Availability configuring and troubleshooting resource list'
    url: https://live.paloaltonetworks.com/t5/Configuration-Articles/High-availability-resource-list/ta-p/55076
  search: HA cluster out of sync failover split brain
  commands:
    fortios:
    - get system ha status
