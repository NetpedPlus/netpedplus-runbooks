- id: wlc-ap
  title: AP ไม่ขึ้นกับ controller / client ต่อ Wi-Fi ไม่ได้
  title_en: AP not joining the controller / clients can't connect to Wi-Fi
  summary: ดูรายการ AP ที่ join, สถิติการ join ที่ล้ม, client และใบรับรอง/เวลา (Cisco 9800, Huawei AC, FortiGate wireless)
  summary_en: Joined APs, failed join statistics, clients and certificate/time (Cisco 9800, Huawei AC, FortiGate wireless)
  params: []
  question: AP ไม่ขึ้นกับ controller หรือ client ต่อไม่ได้ ดูรายการ AP, เหตุผลที่ join ล้ม, จำนวน client, เวลาเครื่อง และเวอร์ชัน แล้วบอกว่าล้มที่ขั้นไหน (ได้ IP, discovery, DTLS/ใบรับรอง, image download, config) พร้อมสาเหตุที่น่าจะเป็นที่สุด
  question_en: APs don't join the controller or clients can't connect. Look at the AP list, join failure reasons, client counts, clock and versions, then say which stage fails (IP, discovery, DTLS/certificate, image download, config) and the most likely cause.
  causes:
  - th: 'AP ไม่ได้ IP หรือหา controller ไม่เจอ: ไม่มี DHCP option 43 / DNS (CISCO-CAPWAP-CONTROLLER) หรืออยู่คนละ subnet โดยไม่มี discovery'
    en: 'AP gets no IP or can''t find the controller: no DHCP option 43 / DNS (CISCO-CAPWAP-CONTROLLER), or a different subnet without discovery'
  - th: 'DTLS / ใบรับรองล้ม: เวลา controller เพี้ยน (ใบรับรองของ AP ''ยังไม่เริ่ม'' หรือหมดอายุ) หรือ AP รุ่นใหม่ใช้ใบรับรองที่ controller เวอร์ชันเก่าไม่รองรับ'
    en: 'DTLS / certificate failure: controller clock is off (AP cert ''not yet valid'' or expired), or a new AP model uses a cert an older controller doesn''t support'
  - th: AP รุ่นใหม่ไม่รองรับใน controller เวอร์ชันปัจจุบัน (ต้องอัปเกรด WLC) หรือ image download ค้าง
    en: The AP model isn't supported by the current controller version (upgrade the WLC), or the image download stalls
  - th: CAPWAP UDP 5246/5247 หรือ Huawei CAPWAP ถูก firewall/ACL บล็อก หรือ MTU ระหว่าง AP กับ controller ต่ำ
    en: CAPWAP UDP 5246/5247 (or Huawei CAPWAP) blocked by a firewall/ACL, or low MTU between AP and controller
  - th: 'เกิน license / AP count ของ controller หรือ AP ไม่ได้อยู่ใน allowlist (Huawei: AP auth mode MAC/SN)'
    en: Controller license / AP count exceeded, or the AP isn't on the allowlist (Huawei AP auth mode MAC/SN)
  refs:
  - title: 'Cisco Community: AP not joining WLC'
    url: https://community.cisco.com/t5/wireless/ap-not-joining-wlc/m-p/5145310
  - title: 'Cisco Community: C9105 AP does not join C9800'
    url: https://community.cisco.com/t5/wireless/c9105-ap-does-not-join-c9800-wlc/td-p/4531624
  - title: 'NetworkLessons: Cisco WLC debug AP not joining'
    url: https://networklessons.com/wireless/cisco-wlc-debug-ap-joining
  - title: 'Huawei: How an AP joins an AC and troubleshooting join failures (V200)'
    url: https://support.huawei.com/enterprise/en/doc/EDOC1100155253
  search: AP not joining controller CAPWAP DTLS 9800 AC offline
  commands:
    cisco_ios:
    - show ap summary
    - show wireless stats ap join summary
    - show ap join stats summary
    - show wireless client summary
    - show clock
    - show wireless management trustpoint
    - show version | include (Version|uptime)
    huawei:
    - display ap all
    - display ap online-fail-record all
    - display ap offline-record all
    - display station all
    - display clock
    - display license
    fortios:
    - get wireless-controller wtp-status
    - diagnose wireless-controller wlac -c wtp
    - diagnose wireless-controller wlac -c sta
