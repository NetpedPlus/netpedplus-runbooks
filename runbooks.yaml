- id: security-updates
  title: License / signature (FortiGuard, Threat, AV) อัปเดตไม่ได้หรือหมดอายุ
  title_en: License / signature (FortiGuard, threat, AV) not updating or expired
  summary: ดูวันหมดอายุ license, เวอร์ชัน signature ล่าสุดที่ได้ และการเชื่อมต่อไปหา update server
  summary_en: License expiry, latest signature versions received, and connectivity to the update servers
  params: []
  question: license หรือ signature ของ security service อัปเดตไม่ได้ ดูวันหมดอายุ, เวอร์ชันและวันที่ของ signature, DNS และการเชื่อมต่อไปหา update server แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: Security service licenses or signatures aren't updating. Look at expiry dates, signature versions and dates, DNS and connectivity to the update servers, then give the most likely cause.
  causes:
  - th: DNS ของ firewall ใช้ไม่ได้หรือชี้ DNS ภายในที่ resolve ชื่อ update server ไม่ได้
    en: The firewall's DNS doesn't work or points to an internal DNS that can't resolve the update servers
  - th: ออกอินเทอร์เน็ตไม่ได้จากตัวเครื่อง (route จาก management/source interface, proxy) หรือ port 443/8888/53 ถูกบล็อก
    en: The box itself can't reach the internet (route from the management/source interface, proxy) or ports 443/8888/53 are blocked
  - th: contract/license หมดอายุ หรือยังไม่ได้ register เครื่องหลังเปลี่ยนเครื่อง (RMA)
    en: Contract/license expired, or the unit wasn't registered after a replacement (RMA)
  - th: เวลาเครื่องเพี้ยนทำให้ TLS กับ update server ล้มเหลว
    en: A wrong clock breaks TLS to the update servers
  - th: 'FortiGate: บาง database แสดงเวอร์ชัน 0.00000 จนกว่าจะเปิดใช้ฟีเจอร์นั้น (ไม่ใช่ความเสีย)'
    en: 'FortiGate: some databases show version 0.00000 until the feature is used (not a fault)'
