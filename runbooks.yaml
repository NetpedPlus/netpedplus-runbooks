- id: lacp-portchannel
  title: Port-channel / LACP ไม่ bundle หรือ suspended
  title_en: Port-channel / LACP not bundling or suspended
  summary: ดูสถานะสมาชิกของ port-channel, LACP partner, ตัวนับ LACPDU และค่าที่ต้องตรงกันทุกพอร์ต
  summary_en: Member state, LACP partner, LACPDU counters and settings that must match on every member
  params:
  - &id002
    key: interface
    label: Interface ที่สงสัย (ไม่บังคับ)
    kind: interface
    hint: เช่น Gi1/0/24, Ethernet1/1, ge-0/0/1
  question: port-channel ไม่ bundle หรือสมาชิก suspended เทียบสองฝั่ง ดูโหมด (active/passive/on), LACP partner (system-id/key), speed/duplex/VLAN/MTU ของสมาชิกที่ต้องเหมือนกัน และตัวนับ LACPDU แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: 'A port-channel is not bundling or members are suspended. Compare both sides: mode (active/passive/on), LACP partner (system-id/key), member speed/duplex/VLAN/MTU that must match, and LACPDU counters, then give the most likely cause.'
  causes:
  - th: 'โหมดไม่เข้ากัน: ฝั่งหนึ่ง ''on'' (static) อีกฝั่ง LACP หรือ passive ทั้งคู่: พอร์ตเป็น suspended / individual'
    en: 'Incompatible modes: one side ''on'' (static) and the other LACP, or passive on both: ports go suspended / individual'
  - th: สมาชิกต่อไปคนละอุปกรณ์ (partner system-id ไม่เหมือนกัน) โดยไม่มี vPC/MLAG/VSX/stack
    en: Members land on different devices (different partner system-id) without vPC/MLAG/VSX/stack
  - th: 'ค่าของสมาชิกไม่เหมือนกัน: speed, duplex, allowed VLAN, native VLAN, MTU, mode access/trunk'
    en: 'Member settings differ: speed, duplex, allowed VLANs, native VLAN, MTU, access/trunk mode'
  - th: 'ไม่ได้รับ LACPDU (ตัวนับ RX ไม่ขึ้น): สายต่อผิดพอร์ต หรืออีกฝั่งยังไม่ได้ตั้ง LACP'
    en: 'No LACPDUs received (RX counter not increasing): cabled to the wrong port, or LACP not configured on the far end'
  - th: 'บน stack/VSS: สมาชิกอยู่บน switch ที่เพิ่งรีบูตหรือ stack แยก'
    en: 'On a stack/VSS: members sit on a member switch that just rebooted or a split stack'
  refs:
