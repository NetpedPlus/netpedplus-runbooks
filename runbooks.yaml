# Runbook = ชุดคำสั่ง "ตรวจอย่างเดียว" (ไม่แก้ค่าอุปกรณ์) ตามอาการ แยกตามภาษาคำสั่งของแต่ละยี่ห้อ
#
# เพิ่ม/แก้ของตัวเองได้โดยสร้างไฟล์ runbooks.yaml ข้างโปรแกรม (โครงสร้างเดียวกัน id เดียวกันจะแทนที่ของเดิม)
# {interface} {peer} {dst} {vlan} คือพารามิเตอร์ที่ผู้ใช้กรอก ถ้าไม่กรอก คำสั่งที่ใช้พารามิเตอร์นั้นจะถูกข้าม
# โปรแกรมตรวจทุกคำสั่งว่าเป็นการอ่านค่า (show/display/get/ping ที่จำกัดจำนวนครั้ง) ถ้าเป็นคำสั่งแก้ค่าจะไม่ถูกโหลด
#
# หมายเหตุ: คำสั่งเขียนจากความรู้เรื่อง CLI ของแต่ละยี่ห้อ ยังไม่ได้ยืนยันกับอุปกรณ์จริงทุกรุ่น
# คำสั่งที่ต่างกันตามเวอร์ชันใส่ไว้ทั้งสองแบบ (เช่น IOS 15 / IOS-XE 16+, FortiOS 6.2 / 6.4+) เครื่องที่ไม่รองรับแบบไหนจะแสดง ⚠ และข้ามได้ครั้งต่อไป
#
# ฟิลด์เสริม (ไม่บังคับ): title_en / summary_en, causes = สาเหตุที่พบบ่อย (เรียงจากเจอบ่อยไปน้อย) จากเอกสารผู้ผลิตและกระทู้ชุมชน
#   เขียนสรุปใหม่ ไม่ได้คัดลอกเนื้อหา, notes = ข้อควรรู้ตามเวอร์ชัน, refs = แหล่งอ้างอิง, search = คำค้นสำหรับปุ่มค้นหาในชุมชน
# pack_version: วันที่ของชุดคู่มือ (ใช้ตอนอัปเดตชุดคู่มือ)

pack_version: '2026.10.12'

runbooks:
- id: ospf-neighbor
  title: OSPF neighbor ไม่ขึ้น / ค้าง
  title_en: OSPF neighbor not coming up / stuck
  summary: ดูสถานะ neighbor, interface ที่เปิด OSPF, timer/MTU/area, config และ log ของแต่ละเครื่อง
  summary_en: Neighbor state, OSPF-enabled interfaces, timers/MTU/area, config and logs on each device
  params:
  - key: interface
    label: Interface ที่ต่อกับเพื่อนบ้าน (ไม่บังคับ)
    kind: interface
    hint: เช่น Gi0/1, Ethernet1/1, ge-0/0/1
  question: OSPF neighbor ไม่ขึ้นเป็น FULL เทียบผลของทุกเครื่อง หา area, network type, timer (hello/dead), MTU, authentication ที่ไม่ตรงกัน แล้วบอกสาเหตุที่น่าจะเป็นที่สุดพร้อมคำสั่งยืนยันขั้นต่อไป
  question_en: The OSPF neighbor is not reaching FULL. Compare the results of all devices and find mismatched area, network type, timers (hello/dead), MTU and authentication, then give the most likely cause with the next confirming command.
  causes:
  - th: 'MTU สองฝั่งไม่เท่ากัน: ค้างที่ EXSTART/EXCHANGE (เจอบ่อยสุดในกระทู้) ดู MTU ของ interface ทั้งสองฝั่ง'
    en: 'MTU mismatch: stuck in EXSTART/EXCHANGE (the most common community case); compare interface MTU on both ends'
  - th: 'area ID, network type (broadcast/point-to-point) หรือ hello/dead timer ไม่ตรงกัน: neighbor ไม่โผล่เลยหรือค้าง INIT'
    en: 'Area ID, network type (broadcast/point-to-point) or hello/dead timers differ: neighbor never appears or stays INIT'
  - th: 'authentication (type หรือ key) ไม่ตรงกัน: ดู log ว่ามี mismatch authentication'
    en: 'Authentication type or key mismatch: look for authentication mismatch in the logs'
  - th: interface เป็น passive-interface หรือไม่ได้ถูกใส่ใน network/area statement
    en: Interface is passive or not covered by a network/area statement
  - th: 'router-id ซ้ำกันในโดเมน: neighbor ขึ้นลงหรือ LSA วน'
    en: 'Duplicate router-ID in the domain: neighbors flap or LSAs churn'
  - th: ACL / firewall policy บล็อก protocol 89 หรือ multicast 224.0.0.5/6 (โดยเฉพาะผ่าน firewall หรือ tunnel)
    en: ACL / firewall policy blocks protocol 89 or multicast 224.0.0.5/6 (especially through firewalls or tunnels)
  refs:
  - title: 'Cisco: What Does the OSPF Neighbor States Mean / EXSTART-EXCHANGE (MTU)'
    url: https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13684-12.html
  - title: 'Huawei: OSPF peer status abnormal (troubleshooting flow)'
    url: https://info.support.huawei.com/network/ptmngsys/Web/tsrev_ar/en/content/ar/17_edesk_ospf_peer_status_abnormal/edesk_ospf_peer_status_abnormal_edesk001.html
  - title: 'H3C: OSPF neighbor establishment failure troubleshooting'
    url: https://knowledge.h3c.com/Theme/details/192362
  - title: 'Cisco Community: OSPF adjacency not forming'
    url: https://community.cisco.com/t5/switching/ospf-adjacency-not-forming/m-p/3876483/highlight/true
  search: OSPF neighbor stuck EXSTART EXCHANGE INIT not forming adjacency
  commands:
    cisco_ios:
    - show ip ospf neighbor
    - show ip ospf interface brief
    - show ip ospf interface {interface}
    - show interfaces {interface}
    - show ip protocols | section ospf
    - show running-config | section router ospf
    - show logging | include OSPF
    nxos:
    - show ip ospf neighbors
    - show ip ospf interface brief
    - show ip ospf interface {interface}
    - show interface {interface}
    - show running-config ospf
    - show logging logfile | include OSPF
    eos:
    - show ip ospf neighbor
    - show ip ospf interface brief
    - show ip ospf interface {interface}
    - show interfaces {interface}
    - show running-config section ospf
    - show logging | include OSPF
    junos:
    - show ospf neighbor
    - show ospf interface
    - show ospf interface {interface} detail
    - show interfaces {interface} extensive
    - show configuration protocols ospf
    - show log messages | match OSPF
    huawei:
    - display ospf peer
    - display ospf interface
    - display ospf error
    - display interface {interface}
    - display logbuffer | include OSPF
    comware:
    - display ospf peer
    - display ospf interface
    - display interface {interface}
    - display logbuffer | include OSPF
    aoscx:
    - show ip ospf neighbors
    - show ip ospf interface
    - show ip ospf interface {interface}
    - show interface {interface}
    fortios:
    - get router info ospf neighbor
    - get router info ospf interface
    - get router info ospf status
    - show router ospf
    ros:
    - /routing ospf neighbor print
    - /routing ospf interface-template print
    - /routing ospf instance print
    asa:
    - show ospf neighbor
    - show ospf interface
    - show interface {interface}
    - show running-config router ospf
    - show logging | include OSPF
    panos:
    - show routing protocol ospf neighbor
    - show routing protocol ospf interface
- id: bgp-neighbor
  title: BGP neighbor ไม่ Established
  title_en: BGP neighbor not Established
  summary: ดูสถานะ session, เหตุผลที่ล้ม, เส้นทางไปหา peer, ping peer และ config BGP
  summary_en: Session state, last reset reason, route to the peer, ping the peer and the BGP config
  params:
  - key: peer
    label: IP ของ BGP peer (ไม่บังคับ แต่ช่วยได้มาก)
    kind: ip
    hint: เช่น 10.0.0.2
  question: BGP neighbor ไม่ขึ้น Established เทียบผลของทุกเครื่อง ดู state (Idle/Active/Connect/OpenSent), AS number, source interface, ebgp-multihop, authentication และเส้นทางไปหา peer แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: The BGP neighbor is not reaching Established. Compare the results of all devices and look at the state (Idle/Active/Connect/OpenSent), AS number, source interface, ebgp-multihop, authentication and the path to the peer, then give the most likely cause.
  causes:
  - th: 'ค้าง Active/Idle เพราะไปหา peer ไม่ถึง: ไม่มี route ไป IP ของ peer หรือใช้ source interface/loopback ผิด (update-source)'
    en: 'Stuck Active/Idle because the peer is unreachable: no route to the peer IP or the wrong source/loopback (update-source)'
  - th: remote-as ไม่ตรง หรือ peer ตั้งค่า neighbor IP ไม่ตรงกับ IP ที่เราใช้เชื่อมต่อ
    en: remote-as mismatch, or the peer has a neighbor IP that doesn't match the source we connect from
  - th: eBGP ผ่านหลาย hop (loopback) แต่ไม่ได้ตั้ง ebgp-multihop / TTL
    en: eBGP over loopbacks without ebgp-multihop / TTL
  - th: 'MD5 password ไม่ตรงกัน: log ขึ้น ''No MD5 digest'' / ''Invalid MD5'''
    en: 'MD5 password mismatch: logs show ''No MD5 digest'' / ''Invalid MD5'''
  - th: TCP 179 ถูก ACL / firewall / control-plane policy บล็อก
    en: TCP 179 blocked by an ACL, firewall or control-plane policy
  - th: 'ขึ้นแล้วหลุดซ้ำ: maximum-prefix เกิน, hold timer หมดเพราะ CPU สูงหรือ MTU ของ path ทำให้ update ใหญ่ส่งไม่ผ่าน'
    en: 'Comes up then drops: maximum-prefix exceeded, hold timer expiry from high CPU, or path MTU blocking large updates'
  refs:
  - title: 'Cisco: Troubleshoot BGP neighbor issues (states Idle/Active)'
    url: https://www3-realm.cisco.com/en/US/tech/tk365/technologies_tech_note09186a008009478a.shtml
  - title: 'Juniper: Verify BGP peer sessions'
    url: https://juniper.net/documentation/en_US/junos13.1/topics/task/verification/bgpp-layer-sessions.html
  - title: 'AfNOG: BGP troubleshooting (PDF)'
    url: https://bgp4all.com/pfs/_media/conferences/afnog2003-bgp-troubleshooting.pdf
  search: BGP neighbor stuck Active Idle not established
  commands:
    cisco_ios:
    - show ip bgp summary
    - show ip bgp neighbors {peer}
    - show ip route {peer}
    - ping {peer} repeat 3
    - show running-config | section router bgp
    - show logging | include BGP
    nxos:
    - show ip bgp summary
    - show ip bgp neighbors {peer}
    - show ip route {peer}
    - ping {peer} count 3
    - show running-config bgp
    - show logging logfile | include BGP
    eos:
    - show ip bgp summary
    - show ip bgp neighbors {peer}
    - show ip route {peer}
    - ping {peer} repeat 3
    - show running-config section bgp
    - show logging | include BGP
    junos:
    - show bgp summary
    - show bgp neighbor {peer}
    - show route {peer}
    - ping {peer} count 3
    - show configuration protocols bgp
    - show log messages | match BGP
    huawei:
    - display bgp peer
    - display bgp peer {peer} verbose
    - display ip routing-table {peer}
    - ping -c 3 {peer}
    - display logbuffer | include BGP
    aoscx:
    - show bgp ipv4 unicast summary
    - show bgp ipv4 unicast neighbors {peer}
    - show ip route {peer}
    - ping {peer} repetitions 3
    fortios:
    - get router info bgp summary
    - get router info bgp neighbors {peer}
    - get router info routing-table details {peer}
    - execute ping {peer}
    ros:
    - /routing bgp session print
    - /routing bgp connection print
    - /ping {peer} count=3
    asa:
    - show bgp summary
    - show bgp neighbors {peer}
    - show route {peer}
    - ping {peer}
    - show running-config router bgp
    panos:
    - show routing protocol bgp summary
    - show routing protocol bgp peer
- id: interface-problem
  title: Interface down / flap / error
  title_en: Interface down / flapping / errors
  summary: ดูสถานะพอร์ต, ตัวนับ error, err-disable, config ของพอร์ตนั้น และ log การขึ้นลง
  summary_en: Port status, error counters, err-disable, the port's config and up/down logs
  params:
  - key: interface
    label: Interface ที่มีปัญหา (ไม่บังคับ)
    kind: interface
    hint: เช่น Gi0/1, Ethernet1/1, ge-0/0/1
  question: Interface มีปัญหา (down / flap / error) ดูสถานะ, error counter (CRC/input errors), duplex/speed, err-disable, และ log เทียบสองฝั่งของลิงก์ แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: An interface has a problem (down / flap / error). Look at its status, error counters (CRC/input errors), duplex/speed, err-disable and logs, compare both ends of the link, then give the most likely cause.
  causes:
  - th: 'CRC / input errors เพิ่มต่อเนื่อง: สายเสีย, หัว RJ45/fiber สกปรก หรือ SFP มีปัญหา ดูค่าแสงด้วยอาการ ''ค่าแสง / SFP'''
    en: 'CRC / input errors keep rising: bad cable, dirty RJ45/fiber connector or a failing SFP; check light levels with the ''optics / SFP'' runbook'
  - th: 'speed/duplex ไม่ตรงกัน (ฝั่งหนึ่ง fix อีกฝั่ง auto): late collision, half-duplex'
    en: 'Speed/duplex mismatch (one side fixed, the other auto): late collisions, half-duplex'
  - th: 'err-disabled จาก BPDU guard, port-security, storm-control, UDLD หรือ link-flap: ดูเหตุผลใน err-disabled'
    en: err-disabled by BPDU guard, port-security, storm-control, UDLD or link-flap; read the reason in the err-disabled list
  - th: 'ลิงก์ขึ้นลงตามรอบ: ปลายทางรีบูต/ประหยัดไฟ (EEE), PoE ไม่พอ หรือ keepalive/UDLD ของสองฝั่งไม่ตรง'
    en: 'Link flaps periodically: the far end reboots or uses power saving (EEE), insufficient PoE, or mismatched keepalive/UDLD'
  - th: SFP ไม่รองรับ (third-party) หรือ speed ของ SFP กับพอร์ตไม่ตรงกัน
    en: Unsupported (third-party) SFP or SFP speed not matching the port
  refs:
  - title: 'Cisco Community: Digital Optical Monitoring (DOM)'
    url: https://supportforums.cisco.com/document/75181/digital-optical-monitoring-dom
  search: interface flapping CRC input errors err-disabled
  commands:
    cisco_ios:
    - show ip interface brief
    - show interfaces status
    - show interfaces status err-disabled
    - show interfaces {interface}
    - show interfaces {interface} counters errors
    - show running-config interface {interface}
    - show logging | include (LINK|LINEPROTO|ERR_DISABLE|DUPLEX)
    - show interfaces {interface} transceiver detail
    nxos:
    - show interface brief
    - show interface status err-disabled
    - show interface {interface}
    - show interface {interface} counters errors
    - show running-config interface {interface}
    - show logging logfile | include (UPDOWN|ETHPM|ERR)
    - show interface {interface} transceiver details
    eos:
    - show interfaces status
    - show interfaces status errdisabled
    - show interfaces {interface}
    - show interfaces {interface} counters errors
    - show running-config interfaces {interface}
    - show logging | include (LINK|LINEPROTO|ETH)
    - show interfaces {interface} transceiver
    junos:
    - show interfaces terse
    - show interfaces {interface} extensive
    - show interfaces diagnostics optics {interface}
    - show configuration interfaces {interface}
    - show log messages | match (UPDOWN|LINK|IFD)
    huawei:
    - display interface brief
    - display interface {interface}
    - display current-configuration interface {interface}
    - display logbuffer | include (UPDOWN|LINK)
    - display transceiver interface {interface} verbose
    comware:
    - display interface brief
    - display interface {interface}
    - display current-configuration interface {interface}
    - display logbuffer | include (UPDOWN|LINK)
    - display transceiver diagnosis interface {interface}
    aoscx:
    - show interface brief
    - show interface {interface}
    - show running-config interface {interface}
    - show interface {interface} transceiver detail
    fortios:
    - get system interface physical
    - diagnose netlink interface list {interface}
    - show system interface {interface}
    - get system interface transceiver
    ros:
    - /interface print
    - /interface print stats
    - /interface ethernet monitor {interface} once
    asa:
    - show interface ip brief
    - show interface {interface}
    - show running-config interface {interface}
    panos:
    - show interface all
    - show interface {interface}
    sonicos:
    - show interfaces
    - show zones
- id: l2-vlan-stp
  title: VLAN / trunk / STP (ชั้น L2 ไม่ผ่านหรือวน)
  title_en: VLAN / trunk / STP (L2 not passing or looping)
  summary: ดู VLAN ที่มี, trunk, ตาราง MAC, สถานะ spanning-tree ของ VLAN ที่สงสัย
  summary_en: VLANs, trunks, MAC table and spanning-tree state of the suspect VLAN
  params:
  - key: vlan
    label: VLAN ID ที่สงสัย (ไม่บังคับ)
    kind: vlan
    hint: เช่น 10
  - key: interface
    label: Interface ที่สงสัย (ไม่บังคับ)
    kind: interface
    hint: เช่น Gi1/0/24
  question: ปัญหาชั้น L2 (VLAN ไม่ผ่าน / trunk / STP) เทียบผลของทุกเครื่อง ดู VLAN ที่อนุญาตบน trunk, native VLAN, MAC ที่เรียนได้, root bridge และพอร์ตที่ block แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: There is a layer 2 problem (VLAN not passing / trunk / STP). Compare the results of all devices and look at the VLANs allowed on the trunk, native VLAN, learned MACs, root bridge and blocked ports, then give the most likely cause.
  causes:
  - th: VLAN ไม่ได้อยู่ใน allowed list ของ trunk ฝั่งใดฝั่งหนึ่ง หรือยังไม่ได้สร้าง VLAN บน switch ตัวกลาง
    en: VLAN missing from the trunk allowed list on one side, or not created on a switch in the middle
  - th: native VLAN ไม่ตรงกันสองฝั่ง (CDP แจ้ง native VLAN mismatch)
    en: Native VLAN mismatch between ends (CDP reports native VLAN mismatch)
  - th: พอร์ตถูก STP block / root bridge ไม่ได้อยู่ที่ core ตามที่ออกแบบ (priority ไม่ได้ตั้ง)
    en: Port blocked by STP / root bridge not at the intended core (priority not set)
  - th: ต่างยี่ห้อใช้ STP คนละโหมด (PVST+ กับ MSTP) หรือ MST region (name/revision/instance mapping) ไม่ตรงกัน
    en: Mixed vendors running different STP modes (PVST+ vs MSTP) or MST region name/revision/VLAN mapping mismatch
  - th: 'loop จากการต่อสายวน / switch เล็กใต้โต๊ะ: MAC flapping และ topology change ถี่ ดูอาการ ''STP topology change ถี่'''
    en: 'Loop from a cabling mistake / small desk switch: MAC flapping and frequent topology changes; see the ''frequent STP topology changes'' runbook'
  refs:
  - title: 'Cisco: Troubleshoot STP issues on Catalyst switches'
    url: https://www3-realm.cisco.com/en/US/tech/tk389/tk621/technologies_tech_note09186a0080094797.shtml
  search: VLAN not passing trunk native VLAN mismatch spanning tree blocking
  commands:
    cisco_ios:
    - show vlan brief
    - show interfaces trunk
    - show vlan id {vlan}
    - show mac address-table vlan {vlan}
    - show spanning-tree vlan {vlan}
    - show spanning-tree summary
    - show interfaces {interface} switchport
    - show spanning-tree mst configuration
    - show cdp neighbors detail | include (Device ID|Native VLAN)
    nxos:
    - show vlan brief
    - show interface trunk
    - show vlan id {vlan}
    - show mac address-table vlan {vlan}
    - show spanning-tree vlan {vlan}
    - show spanning-tree summary
    - show interface {interface} switchport
    eos:
    - show vlan
    - show interfaces trunk
    - show mac address-table vlan {vlan}
    - show spanning-tree vlan {vlan}
    - show spanning-tree
    - show interfaces {interface} switchport
    junos:
    - show vlans
    - show ethernet-switching table
    - show spanning-tree bridge
    huawei:
    - display vlan
    - display vlan {vlan}
    - display mac-address vlan {vlan}
    - display stp brief
    - display interface brief
    - display stp region-configuration
    comware:
    - display vlan
    - display vlan {vlan}
    - display mac-address vlan {vlan}
    - display stp brief
    - display link-aggregation summary
    - display stp region-configuration
    aoscx:
    - show vlan
    - show vlan {vlan}
    - show mac-address-table vlan {vlan}
    - show spanning-tree
    - show interface brief
    - show spanning-tree mst-config
- id: reachability
  title: ติดต่อปลายทางไม่ได้ (routing / ARP / ping)
  title_en: Destination unreachable (routing / ARP / ping)
  summary: ดูว่าเส้นทางไปปลายทางเป็นอย่างไร มี ARP ไหม และ ping จากเครื่องนี้ได้ไหม
  summary_en: Route to the destination, ARP entry and ping from this device
  params:
  - key: dst
    label: IP ปลายทางที่ไปไม่ถึง
    kind: ip
    required: true
    hint: เช่น 10.20.30.40
  question: ปลายทางติดต่อไม่ได้ เทียบผลของทุกเครื่องที่อยู่บนเส้นทาง ดู route ที่ใช้, next-hop, ARP/ND, ผลการ ping แล้วบอกว่าเครื่องไหนคือจุดที่ขาดและสาเหตุที่น่าจะเป็น
  question_en: The destination is unreachable. Compare the results of every device on the path and look at the route used, next-hop, ARP/ND and ping results, then say which device is where the path breaks and the most likely cause.
  causes:
  - th: ไม่มี route ไปปลายทาง หรือไปทาง default ผิดเส้น (ขาดการ redistribute / static ชี้ next-hop ผิด)
    en: No route to the destination, or it follows the wrong default (missing redistribution / static pointing to the wrong next hop)
  - th: 'ขาไปได้แต่ขากลับไม่ได้ (asymmetric): ปลายทางไม่มี route กลับมา หรือ firewall ทิ้งขากลับเพราะ session ไม่ครบ'
    en: 'Forward path works but the return doesn''t (asymmetric): no return route, or a firewall drops the return as it never saw the session'
  - th: 'ARP ไม่ครบ (Incomplete): ปลายทางอยู่คนละ VLAN, ปิด ping หรือ IP ซ้ำ'
    en: 'ARP incomplete: destination is in another VLAN, blocks ping, or has a duplicate IP'
  - th: 'ACL / firewall policy / NAT บล็อกกลางทาง: ใช้หน้าจำลองเส้นทางหรืออาการ ''firewall ทิ้ง traffic / NAT'' ต่อ'
    en: 'An ACL / firewall policy / NAT drops it on the way: continue with the route simulator or the ''firewall drop / NAT'' runbook'
  refs: []
  search: destination unreachable routing ARP incomplete
