- id: vpn-tunnel
  title: VPN IPsec ไม่ขึ้น / หลุดบ่อย
  title_en: IPsec VPN not coming up / dropping
  summary: ดูสถานะ IKE (เฟส 1) และ IPsec (เฟส 2) ของทุก tunnel พร้อมกรอง peer ที่สงสัย
  summary_en: IKE (phase 1) and IPsec (phase 2) state of every tunnel, filtered by the suspect peer
  params:
  - key: peer
    label: IP ของ peer ปลายทาง (ไม่บังคับ)
    kind: ip
    hint: เช่น 203.0.113.10
  question: VPN IPsec ไม่ขึ้นหรือหลุดบ่อย เทียบผลของสองฝั่ง ดู phase 1 (IKE) กับ phase 2 (IPsec) ว่าล้มที่ขั้นไหน, proposal/lifetime/PSK/ID ที่ไม่ตรงกัน, traffic selector (subnet) และเส้นทางไปหา peer แล้วบอกสาเหตุที่น่าจะเป็นที่สุดพร้อมคำสั่งยืนยันขั้นต่อไป
  question_en: IPsec VPN is not coming up or drops often. Compare both sides and look at which step fails between phase 1 (IKE) and phase 2 (IPsec), mismatched proposal/lifetime/PSK/ID, traffic selectors (subnets) and the path to the peer, then give the most likely cause with the next confirming command.
  causes:
  - th: 'phase 1 ไม่ขึ้น: PSK, IKE version, proposal (encryption/DH group) หรือ peer ID / local ID ไม่ตรงกัน'
    en: 'Phase 1 down: PSK, IKE version, proposal (encryption/DH group) or peer/local ID mismatch'
  - th: 'phase 1 ขึ้นแต่ phase 2 ไม่ขึ้น: traffic selector (subnet local/remote) ไม่ตรงกันสองฝั่ง หรือ PFS ไม่ตรง'
    en: 'Phase 1 up but phase 2 down: traffic selectors (local/remote subnets) don''t mirror each other, or PFS mismatch'
  - th: 'phase 2 หลุดหลัง rekey / tunnel flap: lifetime ต่างกัน หรือ DPD ไม่ตรง (FortiGate มีบทความเฉพาะ)'
    en: 'Phase 2 drops after rekey / tunnel flap: different lifetimes or DPD settings (FortiGate has a dedicated article)'
  - th: 'NAT-T: มี NAT กลางทาง แต่ UDP 4500/500 ถูกบล็อก หรือ ISP router แปลงพอร์ต'
    en: 'NAT-T: NAT in the path but UDP 500/4500 blocked or rewritten by the ISP router'
  - th: 'tunnel ขึ้นแต่ traffic ไม่ผ่าน: ไม่มี route เข้า tunnel, policy/ACL, หรือ NAT ไปแปลง traffic ที่ควรเข้า VPN (ต้อง no-NAT/identity NAT)'
    en: 'Tunnel up but no traffic: missing route into the tunnel, policy/ACL, or NAT translating traffic that should go into the VPN (needs no-NAT/identity NAT)'
  refs:
  - title: 'Fortinet: Phase1 up but phase2 down after IKE rekey or tunnel flap'
    url: https://community.fortinet.com/fortigate-3/troubleshooting-tip-phase1-is-up-yet-phase2-is-down-after-ike-rekey-or-tunnel-flap-202350
  - title: 'Fortinet: IPsec related diagnose commands'
    url: https://www.fortinetguru.com/2019/12/troubleshooting-ipsec-related-diagnose-command/
  - title: 'Palo Alto LIVEcommunity: IPsec tunnel down'
    url: https://live.paloaltonetworks.com/t5/next-generation-firewall/ipsec-tunnel-down/td-p/593939
  - title: 'Palo Alto LIVEcommunity: Trouble with IPSec-SA'
    url: https://live.paloaltonetworks.com/t5/general-topics/trouble-with-ipsec-sa/td-p/152727
  search: IPsec VPN phase 1 phase 2 down tunnel
  commands:
    cisco_ios:
    - show crypto isakmp sa
    - show crypto ikev2 sa
    - show crypto ipsec sa
    - show crypto ipsec sa peer {peer}
    - show ip route {peer}
    - show crypto session detail
    asa:
    - show vpn-sessiondb summary
    - show vpn-sessiondb l2l
    - show crypto ikev1 sa
    - show crypto ikev2 sa
    - show crypto ipsec sa
    - show crypto ipsec sa peer {peer}
    - show route {peer}
