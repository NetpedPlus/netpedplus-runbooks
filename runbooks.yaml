- id: fw-policy
  title: Firewall ทิ้ง traffic / NAT ไม่ทำงาน
  title_en: Firewall dropping traffic / NAT not working
  summary: จำลอง packet ผ่าน policy/NAT จริงของเครื่อง (ASA packet-tracer, PAN-OS test), ดู session, NAT และตัวนับการทิ้ง
  summary_en: Simulate the packet through the box's own policy/NAT (ASA packet-tracer, PAN-OS test), and check sessions, NAT and drop counters
  params:
  - key: src
    label: IP ต้นทาง
    kind: ip
    hint: เช่น 192.168.10.20
  - key: dst
    label: IP ปลายทาง
    kind: ip
    hint: เช่น 10.20.30.40
  - key: port
    label: พอร์ตปลายทาง (TCP)
    kind: port
    hint: เช่น 443
  - key: interface
    label: Interface/nameif ขาเข้า (ASA ต้องใช้, FortiGate ใช้กับ iprope lookup)
    kind: interface
    hint: เช่น inside, port1
  question: traffic ถูก firewall ทิ้งหรือ NAT ไม่ทำงาน ดูผลการจำลองของเครื่อง (policy ที่ match, NAT ที่ใช้, เหตุที่ drop), session ที่มีอยู่ และตัวนับการทิ้ง แล้วบอก rule/NAT ที่เป็นต้นเหตุและสิ่งที่ต้องแก้
  question_en: Traffic is being dropped by the firewall or NAT doesn't work. Look at the device's own simulation (matched policy, NAT used, drop reason), existing sessions and drop counters, then name the rule/NAT at fault and what to change.
  causes:
  - th: 'policy ที่ match ก่อนเป็น deny (ลำดับ rule) หรือ implicit deny ท้ายสุด: ดู rule ที่ match ในผลจำลอง'
    en: 'A deny rule matches first (rule order) or the implicit deny at the end: check the matched rule in the simulation'
  - th: zone / interface ไม่ตรงกับที่คิด เพราะ route ขาออกไปอีกทาง (ต้องดู route ก่อน policy)
    en: Zone / interface isn't what you expect because the egress route goes elsewhere (routing is evaluated before policy)
  - th: 'NAT: ลำดับ NAT rule ทับกัน, ขาด no-NAT สำหรับ VPN, หรือ port forward (VIP/DNAT) ไม่ได้ผูกกับ policy ที่อนุญาต IP ภายใน'
    en: 'NAT: overlapping NAT order, missing no-NAT for VPN, or a port forward (VIP/DNAT) not tied to a policy allowing the internal IP'
  - th: 'asymmetric routing: firewall เห็นแค่ขาเดียว ทิ้งเพราะ session ไม่มี SYN (ASA: tcp-not-syn, Forti: no session matched)'
    en: 'Asymmetric routing: the firewall only sees one direction and drops packets without a session (ASA tcp-not-syn, Forti ''no session matched'')'
  - th: application / security profile (App-ID, IPS, SSL inspection) บล็อก ไม่ใช่ policy L4
    en: An application / security profile (App-ID, IPS, SSL inspection) blocks it, not the L4 policy
  refs:
  - title: 'Cisco Community: Troubleshooting access problems using packet-tracer'
    url: https://community.cisco.com/t5/security-knowledge-base/troubleshooting-access-problems-using-packet-tracer/ta-p/3114976
  - title: 'Cisco: ASA NAT troubleshooting (PDF)'
    url: https://bxin.cisco.com/c/en/us/support/docs/security/asa-5500-x-series-next-generation-firewalls/116388-technote-nat-00.pdf
  search: firewall policy drop NAT not working packet-tracer
  commands:
