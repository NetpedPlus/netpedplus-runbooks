- id: ntp-time
  title: เวลาเครื่องเพี้ยน / NTP ไม่ sync
  title_en: Device clock wrong / NTP not syncing
  summary: ดูสถานะ NTP, server ที่ใช้, stratum และเวลาปัจจุบัน (เวลาเพี้ยนทำให้ log, ใบรับรอง, 802.1X, VPN มีปัญหา)
  summary_en: NTP status, servers, stratum and the current clock (a wrong clock breaks logs, certificates, 802.1X and VPN)
  params: []
  question: เวลาเครื่องเพี้ยนหรือ NTP ไม่ sync ดูสถานะ association, stratum, reachability, source interface, timezone และเวลาปัจจุบัน แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: The device clock is wrong or NTP isn't syncing. Look at association state, stratum, reachability, source interface, timezone and the current time, then give the most likely cause.
  causes:
  - th: 'ไปหา NTP server ไม่ถึง: ไม่มี route จาก source interface ที่ใช้ หรือ firewall บล็อก UDP 123'
    en: 'NTP server unreachable: no route from the source interface used, or a firewall blocks UDP 123'
  - th: เวลาห่างจาก server มากเกินไปจนไม่ยอม sync (บางยี่ห้อต้องตั้งเวลาใกล้เคียงก่อน)
    en: Clock is too far off for NTP to accept (some platforms need the clock set close first)
  - th: authentication key ของ NTP ไม่ตรง หรือ server ตั้งให้ตอบเฉพาะบาง IP
    en: NTP authentication key mismatch, or the server only answers some IPs
  - th: 'เวลาถูกแต่ timezone / summer-time ผิด: log ดูเพี้ยนแต่ NTP ปกติ'
    en: 'Time is right but timezone / summer-time is wrong: logs look off while NTP is fine'
