- id: sdwan
  title: SD-WAN / health check / เลือกเส้นทางผิด
  title_en: SD-WAN / health check / wrong path selection
  summary: ดูสถานะ health check (latency, jitter, loss) ของแต่ละลิงก์ และกฎ SD-WAN ว่าเลือกเส้นไหน
  summary_en: Health-check state (latency, jitter, loss) per link and which link each SD-WAN rule picks
  params: []
  question: SD-WAN เลือกเส้นทางผิดหรือลิงก์ถูกตัดออก ดูผล health check ของแต่ละ member (latency/jitter/loss เทียบ SLA), สถานะ member และกฎที่ match แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: SD-WAN picks the wrong path or a link gets removed. Look at each member's health check (latency/jitter/loss vs SLA), member state and the matching rules, then give the most likely cause.
  causes:
  - th: เป้าหมายของ health check (เช่น 8.8.8.8) ตอบช้า/ไม่ตอบ ทำให้ลิงก์ถูกตัดทั้งที่ใช้งานได้
    en: The health-check target (e.g. 8.8.8.8) is slow or silent, so a working link is removed
  - th: SLA ตั้งเข้มเกินจริงกับลิงก์ที่มี (latency/jitter threshold)
    en: SLA thresholds are stricter than the link can meet (latency/jitter)
  - th: 'ลำดับกฎ SD-WAN: กฎบนกว่า match ก่อน traffic จึงไม่ไปตามกฎที่ตั้งใจ'
    en: 'SD-WAN rule order: an earlier rule matches first, so traffic doesn''t follow the intended rule'
  - th: 'FortiOS 6.2 ใช้ชื่อ virtual-wan-link ส่วน 6.4+ เป็น sdwan: ใส่คำสั่งไว้ทั้งสองแบบ'
    en: FortiOS 6.2 uses 'virtual-wan-link'; 6.4+ uses 'sdwan'. Both commands are included
  refs: []
  search: FortiGate SD-WAN health check SLA member dead wrong path
  commands:
    fortios:
    - diagnose sys sdwan health-check
    - diagnose sys sdwan member
    - diagnose sys sdwan service
    - diagnose sys virtual-wan-link health-check
    - diagnose sys virtual-wan-link member
    - diagnose sys virtual-wan-link service
    - get router info routing-table all
- id: mlag-stack
  title: vPC / MLAG / VSX / stack / IRF ไม่ปกติ
  title_en: vPC / MLAG / VSX / stack / IRF unhealthy
  summary: ดูสถานะ peer-link, keepalive, consistency และสมาชิกของ stack / virtual chassis
  summary_en: Peer-link, keepalive, consistency and members of the stack / virtual chassis
  params: []
  question: multi-chassis (vPC/MLAG/VSX) หรือ stack (IRF/CSS/iStack/StackWise) ไม่ปกติ ดูสถานะ peer-link, keepalive, ผลตรวจ consistency, บทบาท primary/secondary และสมาชิกที่หาย แล้วบอกสาเหตุที่น่าจะเป็นที่สุด
  question_en: Multi-chassis (vPC/MLAG/VSX) or a stack (IRF/CSS/iStack/StackWise) is unhealthy. Look at peer-link and keepalive state, consistency checks, primary/secondary roles and missing members, then give the most likely cause.
  causes:
  - th: 'consistency ไม่ผ่าน (type-1): STP mode, VLAN, MTU หรือ LACP ของสองฝั่งไม่เหมือนกัน ทำให้พอร์ต suspended'
    en: 'Consistency check fails (type-1): STP mode, VLANs, MTU or LACP differ between peers, suspending ports'
  - th: peer-keepalive หลุด (ใช้ VRF/management เดียวกับที่ล่ม) ทำให้เสี่ยง split-brain เมื่อ peer-link หลุดด้วย
    en: Peer-keepalive down (sharing a VRF/management path that failed) risks split-brain if the peer-link also drops
  - th: peer-link มีแค่เส้นเดียวหรืออยู่บน line card เดียวกัน
    en: The peer-link is a single link or sits on a single line card
  - th: 'stack: สาย stack หลวม/เสีย, เวอร์ชันของสมาชิกไม่ตรง หรือ priority/member ID ชนกัน'
    en: 'Stack: loose/bad stack cable, member version mismatch, or priority/member ID conflicts'
  - th: 'Arista MLAG: config-sanity ต่าง (VLAN/interface) จะขึ้นใน ''show mlag config-sanity'''
    en: 'Arista MLAG: config-sanity differences (VLANs/interfaces) appear in ''show mlag config-sanity'''
  refs:
