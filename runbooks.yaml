- id: resources
  title: CPU / Memory สูง หรือเครื่องช้า
  title_en: High CPU / memory or slow device
  summary: ดูการใช้ CPU/หน่วยความจำ, process ที่กินทรัพยากร, uptime และ log ที่เกี่ยวข้อง
  summary_en: CPU/memory usage, top processes, uptime and related logs
  params: []
  question: อุปกรณ์ใช้ CPU/Memory สูงหรือช้า ดู process ที่กินทรัพยากร, uptime (รีบูตเองไหม), log ที่ผิดปกติ แล้วบอกสาเหตุที่น่าจะเป็นพร้อมคำสั่งตรวจต่อ
  question_en: A device has high CPU/memory or is slow. Look at the processes using resources, uptime (did it reboot by itself), and abnormal logs, then give the most likely cause with the next check commands.
  causes:
  - th: 'traffic ถูก punt ขึ้น CPU: ARP/broadcast storm, loop, TTL หมด, packet ที่ต้อง process switch (ดู process ที่สูงสุดและ interrupt)'
    en: 'Traffic punted to the CPU: ARP/broadcast storm, loop, TTL expiry, process-switched packets (check the top process and interrupt load)'
  - th: SNMP polling / NMS ถี่เกินไป หรือ SSH/HTTPS management ถูกสแกน
    en: Aggressive SNMP polling / NMS, or management (SSH/HTTPS) being scanned
  - th: 'FortiGate เข้า conserve mode: memory เกิน 88% (ค่าเริ่มต้น) จาก IPS/WAD/fcnacd หรือ memory leak ในบางเวอร์ชัน (เช่น node ใน 7.4.8/7.6.3)'
    en: 'FortiGate enters conserve mode: memory above 88% (default) from IPS/WAD/fcnacd, or a memory leak in some builds (e.g. node in 7.4.8/7.6.3)'
  - th: 'Palo Alto dataplane CPU สูง: session เยอะ, decryption, zone protection/DoS ไม่ได้ตั้ง หรือ traffic ผิดปกติ ดู resource-monitor'
    en: 'Palo Alto high dataplane CPU: session load, decryption, missing zone protection/DoS, or abnormal traffic; check the resource monitor'
  - th: 'บั๊กของเวอร์ชัน: ค้นด้วยรุ่นและเวอร์ชันในปุ่มค้นหาในชุมชน แล้วดู release notes / known issues'
    en: 'Software bug: search with the model and version using the community search buttons, then check release notes / known issues'
  notes:
  - th: Cisco IOS-XE 16.x ขึ้นไปมีคำสั่งดู CPU แยก control-plane กับ platform (show processes cpu platform sorted)
    en: Cisco IOS-XE 16.x+ separates control-plane and platform CPU (show processes cpu platform sorted)
